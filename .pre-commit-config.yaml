repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--recursive
      - id: terraform_checkov
        args:
          - --args=--directory .
      # - id: infracost_breakdown
      #   args:
      #     - --args=--path=.
      #   verbose: true # Always show costs
